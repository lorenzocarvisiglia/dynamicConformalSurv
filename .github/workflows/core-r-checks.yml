name: Core R checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse public R scripts
        run: |
          Rscript -e 'files <- list.files(c("R", "reproduction"), pattern = "\\.R$", recursive = TRUE, full.names = TRUE); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files successfully.\n")'

      - name: Run core helper checks
        run: Rscript tests/test_core_helpers.R
